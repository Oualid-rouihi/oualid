name: Windows RDP via Tailscale

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Set RDP Password'
        required: true

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Initializing
        run: |
          echo "Starting Windows cloud machine..."

      - name: Install Tailscale
        run: |
          echo "Downloading Tailscale..."
          
          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile "tailscale.exe"

          echo "Installing..."
          
          Start-Process `
            -FilePath ".\tailscale.exe" `
            -ArgumentList "/quiet" `
            -Wait

          Start-Sleep -Seconds 15

          echo "Tailscale installed."

      - name: Connect to Tailscale
        run: |
          echo "Connecting to Tailscale network..."

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TS_KEY }} `
            --hostname=cloud-rdp-${{ github.run_id }} `
            --accept-routes

          echo "Connected successfully."

          echo "Tailscale IP:"
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: Configure Windows RDP
        run: |
          echo "Setting password..."

          net user runneradmin "${{ github.event.inputs.password }}"

          echo "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          echo "Disabling NLA..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0

          echo "Enabling firewall rules..."

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          echo "Starting RDP service..."

          Start-Service TermService

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          echo "Checking service status..."

          Get-Service TermService

      - name: Display Connection Info
        run: |
          echo "====================================="
          echo "RDP SERVER READY"
          echo "====================================="
          echo "USERNAME: runneradmin"
          echo "PASSWORD: ${{ github.event.inputs.password }}"
          echo ""
          echo "Tailscale IPv4:"
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "====================================="

      - name: Keep Runner Alive
        run: |
          echo "Keeping machine online..."

          while ($true) {
            echo "Alive: $(Get-Date)"
            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        run: |
          echo "Disconnecting Tailscale..."

          & "C:\Program Files\Tailscale\tailscale.exe" down
